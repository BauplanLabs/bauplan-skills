version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      time: "10:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
